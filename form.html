<!DOCTYPE html>
<html>

<head>
    <title>Login Form</title>
</head>

<body style="margin:0; font-family:Arial, sans-serif; background:#f2f2f2;">

    <div
        style="width:320px; margin:100px auto; background:white; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.2);">

        <h2 style="text-align:center; color:#333;">Login Form</h2>

        <form action="/process_get" method="GET">

            <label>Username</label><br>
            <input type="text" name="username" placeholder="Enter Username" required
                style="width:100%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

            <label>Password</label><br>
            <input type="password" name="password" placeholder="Enter Password" required
                style="width:100%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

            <input type="submit" value="Submit"
                style="width:100%; padding:10px; background:#007BFF; color:white; border:none; border-radius:5px; cursor:pointer;">

        </form>

    </div>

</body>

</html>
